name: Docker Deployment

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/neezamiya-insti/nestick_lms:latest

      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}" \
            -t $IMAGE_NAME .


      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME



      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

        script: |

          set -e

          echo "✅ Connected to VPS"

          echo "🔐 Logging into GHCR..."

          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ secrets.GHCR_USERNAME }}" \
            --password-stdin


          echo "📥 Pulling latest Docker image..."

          docker pull ghcr.io/neezamiya-insti/nestick_lms:latest


          echo "🛑 Stopping old container..."

          docker stop LMS_neezamiya || true


          echo "🗑 Removing old container..."

          docker rm LMS_neezamiya || true



          echo "🚀 Starting new container..."

          docker run -d \
            --name LMS_neezamiya \
            --restart unless-stopped \
            -p 3002:3000 \
            -e NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}" \
            -e DB_HOST="${{ secrets.DB_HOST }}" \
            -e DB_PORT="${{ secrets.DB_PORT }}" \
            -e DB_USER="${{ secrets.DB_USER }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e DB_NAME="${{ secrets.DB_NAME }}" \
            -e EMAIL_USER="${{ secrets.EMAIL_USER }}" \
            -e EMAIL_PASS="${{ secrets.EMAIL_PASS }}" \
            -e CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}" \
            -e CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}" \
            -e CLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}" \
            -e CLOUDINARY_UPLOAD_PRESET="${{ secrets.CLOUDINARY_UPLOAD_PRESET }}" \
            ghcr.io/neezamiya-insti/nestick_lms:latest



          echo "⏳ Waiting for application startup..."

          sleep 30



          echo "❤️ Checking Docker Health Status..."

          HEALTH=$(docker inspect --format='{{.State.Health.Status}}' LMS_neezamiya)


          echo "Docker Health: $HEALTH"


          if [ "$HEALTH" != "healthy" ]; then

            echo "❌ Docker Health Check Failed"

            docker logs LMS_neezamiya

            exit 1

          fi



          echo "🌐 Checking Health API..."


          if curl -fs http://localhost:3002/api/health > /dev/null; then

            echo "✅ LMS Health API Passed"

          else

            echo "❌ LMS Health API Failed"

            docker logs LMS_neezamiya

            exit 1

          fi



          echo "📦 Running Containers..."

          docker ps



          echo "🎉 LMS Deployment Completed Successfully"